services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atrium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atrium}
      POSTGRES_DB: ${POSTGRES_DB:-atrium}
    volumes:
      - atrium-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atrium} -d ${POSTGRES_DB:-atrium}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: atrium:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-atrium}:${POSTGRES_PASSWORD:-atrium}@db:5432/${POSTGRES_DB:-atrium}
      PORT: "8080"
      NODE_ENV: production
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-eve@frieswings.com}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-atrium}
      SEED_USER_NAME: ${SEED_USER_NAME:-Eve Holt}
    ports:
      - "${PORT:-8080}:8080"

volumes:
  atrium-pgdata:
